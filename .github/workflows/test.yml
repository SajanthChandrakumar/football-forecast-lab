name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend-v2
        run: node --test tests/*.test.mjs

      - name: Frontend typecheck
        working-directory: frontend-v2
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend-v2
        run: npm run lint

      - name: Frontend production build
        working-directory: frontend-v2
        run: npm run build

      - name: Install browser test runtime
        working-directory: frontend-v2
        run: npx playwright install --with-deps chromium

      - name: Browser workflow and responsive tests
        working-directory: frontend-v2
        run: npm run test:e2e

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: |
            frontend-v2/playwright-report/
            frontend-v2/test-results/
          retention-days: 7
          if-no-files-found: ignore
